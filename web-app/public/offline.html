<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — Team Matches Manager</title>
    <style>
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --text: #0f172a;
        --text-muted: #475569;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --border: #e2e8f0;
        --radius-md: 10px;
        --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        padding: 32px;
        text-align: center;
      }

      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #38bdf8, #2563eb);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }

      p {
        margin: 0 0 24px;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Sin conexión</h1>
      <p>
        No se puede conectar a internet en este momento. Comprueba tu red y
        vuelve a intentarlo.
      </p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </div>
  </body>
</html>
